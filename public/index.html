  <style>
    * {
      box-sizing: border-box;
    }
    
    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }
    
    #root {
      display: flex;
      flex-direction: column;
      /* Поддержка safe-area для веб-платформы */
      padding-left: env(safe-area-inset-left, 0);
      padding-right: env(safe-area-inset-right, 0);
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    
    /* Дополнительная поддержка для элементов с абсолютным позиционированием */
    @supports (padding: max(0px)) {
      #root {
        padding-left: max(env(safe-area-inset-left), 0px);
        padding-right: max(env(safe-area-inset-right), 0px);
        padding-top: max(env(safe-area-inset-top), 0px);
        padding-bottom: max(env(safe-area-inset-bottom), 0px);
      }
    }
  </style>
</head>
<body>
  <noscript>Вам необходимо включить JavaScript для работы этого приложения.</noscript>
  <div id="root"></div>
  
  <!-- Регистрация Service Worker для PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        let registration;
        
        // Функция для проверки версии билда
        async function checkBuildVersion() {
          try {
            // Загружаем текущую версию билда с сервера
            const response = await fetch('/build-info.json?t=' + Date.now(), { cache: 'no-store' });
            if (!response.ok) {
              console.log('[PWA Update] build-info.json не найден, пропускаем проверку');
              return false;
            }
            
            const buildInfo = await response.json();
            const currentBuildId = buildInfo.buildId;
            const vercelEnv = buildInfo.vercelEnv;
            
            console.log('[PWA Update] Build ID на сервере:', currentBuildId);
            console.log('[PWA Update] Vercel Environment:', vercelEnv);
            console.log('[PWA Update] Vercel Deployment ID:', buildInfo.vercelDeploymentId);
            
            // Получаем сохраненный build ID
            const savedBuildId = localStorage.getItem('pwa-build-id');
            console.log('[PWA Update] Сохраненный Build ID:', savedBuildId);
            
            // Если есть сохраненный ID и он отличается - есть обновление
            if (savedBuildId && savedBuildId !== currentBuildId) {
              console.log('[PWA Update] ✅ Обнаружен новый билд!');
              console.log('[PWA Update] Старый:', savedBuildId);
              console.log('[PWA Update] Новый:', currentBuildId);
              
              // Сохраняем информацию об обновлении
              localStorage.setItem('pwa-update-available', 'true');
              localStorage.setItem('pwa-new-build-id', currentBuildId);
              
              const event = new CustomEvent('PWA_UPDATE_AVAILABLE', { 
                bubbles: true,
                cancelable: true,
                detail: { oldBuildId: savedBuildId, newBuildId: currentBuildId }
              });
              window.dispatchEvent(event);
              return true;
            }
            
            // Сохраняем текущий build ID
            if (currentBuildId) {
              localStorage.setItem('pwa-build-id', currentBuildId);
              // Для обратной совместимости
              localStorage.setItem('pwa-build-version', buildInfo.version);
            }
            
            return false;
          } catch (error) {
            console.error('[PWA Update] Ошибка при проверке версии билда:', error);
            return false;
          }
        }

        // Функция для проверки и уведомления об обновлении (старая логика через SW)
        function checkForUpdate(reg) {
          console.log('[PWA Update] Проверка обновлений через SW...');
          console.log('[PWA Update] Installing:', reg.installing);
          console.log('[PWA Update] Waiting:', reg.waiting);
          console.log('[PWA Update] Active:', reg.active);
          console.log('[PWA Update] Controller:', navigator.serviceWorker.controller);
          
          // Если уже есть waiting worker - показываем уведомление
          if (reg.waiting && navigator.serviceWorker.controller) {
            console.log('[PWA Update] ✅ Обнаружен waiting worker - отправляем событие');
            localStorage.setItem('pwa-update-available', 'true');
            const event = new CustomEvent('PWA_UPDATE_AVAILABLE', { 
              bubbles: true,
              cancelable: true 
            });
            window.dispatchEvent(event);
            console.log('[PWA Update] Событие отправлено');
            return true;
          }
          return false;
        }
        
        // Обработчик изменения состояния installing worker
        function trackInstalling(worker) {
          const notifyUpdate = () => {
            console.log('[PWA Update] ✅ Новая версия установлена - отправляем событие');
            localStorage.setItem('pwa-update-available', 'true');
            const event = new CustomEvent('PWA_UPDATE_AVAILABLE', { 
              bubbles: true,
              cancelable: true 
            });
            window.dispatchEvent(event);
            console.log('[PWA Update] Событие отправлено');
          };

          worker.addEventListener('statechange', () => {
            console.log('[PWA Update] Worker state changed to:', worker.state);
            // Когда worker переходит в installed или waiting - показываем уведомление
            if ((worker.state === 'installed' || worker.state === 'waiting') && navigator.serviceWorker.controller) {
              console.log('[PWA Update] Новая версия установлена (state:', worker.state, ')');
              notifyUpdate();
            }
          });
          
          // Также проверяем текущее состояние на случай если оно уже installed/waiting
          if ((worker.state === 'installed' || worker.state === 'waiting') && navigator.serviceWorker.controller) {
            console.log('[PWA Update] Worker уже в состоянии', worker.state);
            notifyUpdate();
          }
        }

        navigator.serviceWorker
          .register('/service-worker.js')
          .then((reg) => {
            registration = reg;
            console.log('[PWA Update] Service Worker зарегистрирован:', registration.scope);
            
            // Проверяем версию билда при загрузке (основной способ)
            checkBuildVersion().then((hasUpdate) => {
              if (!hasUpdate) {
                // Если нет обновления по версии, проверяем через SW (fallback)
                checkForUpdate(reg);
              }
            });
            
            // Следим за новыми обновлениями через SW (fallback)
            reg.addEventListener('updatefound', () => {
              console.log('[PWA Update] Обнаружено обновление через SW!');
              const newWorker = reg.installing;
              if (newWorker) {
                trackInstalling(newWorker);
              }
            });
            
            // Периодически проверяем версию билда (каждые 30 секунд)
            // Это нужно чтобы пользователь узнал об обновлении сразу после деплоя
            setInterval(() => {
              console.log('[PWA Update] Периодическая проверка версии билда...');
              checkBuildVersion();
            }, 30 * 1000); // 30 секунд
          })
          .catch((error) => {
            console.error('[PWA Update] Ошибка регистрации Service Worker:', error);
          });

        // Обработчик для команды на обновление от приложения
        window.addEventListener('message', (event) => {
          if (event.data?.type === 'SKIP_WAITING') {
            console.log('[PWA Update] Получена команда SKIP_WAITING');
            if (registration?.waiting) {
              console.log('[PWA Update] Отправляем SKIP_WAITING в waiting worker');
              registration.waiting.postMessage({type: 'SKIP_WAITING'});
            } else {
              console.log('[PWA Update] Нет waiting worker!');
            }
          }
        });

        // Перезагружаем страницу, когда новый SW берет управление (после skipWaiting)
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          console.log('[PWA Update] Controller changed - перезагрузка...');
          if (!refreshing) {
            window.location.reload();
            refreshing = true;
          }
        });
      });
    }
  </script>
</body>
</html>
